{% extends "base.html" %}

{% block sadrzaj %}

  <p class="text-lg">{% translate "Probna stranica: ako je naslov velik, Tailwind radi." %}</p>

  <button class="rounded-lg bg-gray-900 px-5 py-3 text-lg text-white"

    {% translate "Isprobaj HTMX" %}
